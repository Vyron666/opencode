version: "3.9"

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencode-local:latest
    container_name: opencode-local
    restart: unless-stopped
    ports:
      - "4096:4096"
    environment:
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: "change-me"
      OPENCODE_DISABLE_MODELS_FETCH: "0"
    volumes:
      - ./docker-data/opencode:/root/.local/share/opencode
      - ./.opencode/skills:/workspace/.opencode/skills:ro
      - ./.opencode:/workspace/.opencode
      - ./workspaces:/workspace/workspaces
    working_dir: /workspace
    command: ["web", "--hostname", "0.0.0.0", "--port", "4096"]
